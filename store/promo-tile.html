<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store promo tile</title>
    <!-- Chrome Web Store small promo tile (440x280). Regenerate: npm run store:images -->
    <link rel="stylesheet" href="store.css" />
  </head>
  <body>
    <div class="tile">
      <div class="row">
        <img src="../icons/icon128.png" width="56" height="56" alt="" />
        <h1>Bot Meter</h1>
      </div>
      <p>Posts-per-day on every account in your X feed. Spot bots at a glance.</p>
      <div class="badges">
        <span class="pill ok">2.1/day</span>
        <span class="pill warn">72/day</span>
        <span class="pill bot">412/day</span>
      </div>
    </div>
  </body>
</html>
