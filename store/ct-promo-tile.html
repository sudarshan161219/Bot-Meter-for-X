<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Creator Tools promo tile</title>
    <!-- Chrome Web Store small promo tile (440x280). Regenerate: npm run store:images -->
    <link rel="stylesheet" href="store.css" />
    <style>
      .tile .formats { display: flex; flex-wrap: wrap; gap: 8px; }
      .tile .formats span { padding: 3px 10px; border-radius: 999px; background: rgba(29, 155, 240, 0.16); color: #8ecdf8; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="row">
        <img src="../creator-tools/icons/icon128.png" width="56" height="56" alt="" />
        <h1>Creator Tools for X</h1>
      </div>
      <p>Export threads. Search, tag and export your bookmarks. All on your device.</p>
      <div class="formats"><span>Carousel</span><span>Markdown</span><span>PDF</span><span>Bookmarks</span></div>
    </div>
  </body>
</html>
