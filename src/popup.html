<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bot Meter for X</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>Bot Meter for X</h1>
    </header>

    <form id="form">
      <label class="row">
        <span>Enabled</span>
        <input type="checkbox" name="enabled" />
      </label>

      <label class="row" title="Off: only flag high-rate accounts">
        <span>Badge on every account</span>
        <input type="checkbox" name="showAll" />
      </label>

      <label class="row">
        <span><i class="dot warn"></i>High rate at</span>
        <span class="num"><input type="number" name="warnRate" min="1" step="1" /> /day</span>
      </label>

      <label class="row">
        <span><i class="dot bot"></i>Likely bot at</span>
        <span class="num"><input type="number" name="botRate" min="1" step="1" /> /day</span>
      </label>

      <label class="row">
        <span>Posts from likely bots</span>
        <select name="botAction">
          <option value="label">Just label</option>
          <option value="dim">Dim</option>
          <option value="collapse">Collapse</option>
        </select>
      </label>

      <label class="row" title="Uses X's own sensitive-content flags on posts, media and accounts">
        <span>Adult (18+) content</span>
        <select name="adultAction">
          <option value="off">Off</option>
          <option value="label">Label</option>
          <option value="blur">Blur</option>
          <option value="hide">Hide</option>
        </select>
      </label>

      <label class="row" title="NSFW, 18+, OnlyFans, 🔞 in posts and display names">
        <span>Also match adult words</span>
        <input type="checkbox" name="adultWords" />
      </label>

      <fieldset>
        <legend title="Off: no badge, never dimmed or collapsed as a bot">Check these posts for bots</legend>
        <div class="chips">
          <label><input type="checkbox" name="onReplies" /> Replies</label>
          <label><input type="checkbox" name="onReposts" /> Reposts</label>
          <label><input type="checkbox" name="onQuotes" /> Quoted posts</label>
        </div>
      </fieldset>

      <fieldset>
        <div class="chips">
          <b>Hide:</b>
          <label title="Promoted posts"><input type="checkbox" name="hidePromoted" /> Ads</label>
          <label><input type="checkbox" name="hideWhoToFollow" /> Who to follow</label>
          <label title="The &quot;What's happening&quot; / trends box"><input type="checkbox" name="hideTrends" /> Trends</label>
          <label title="The &quot;Subscribe to Premium&quot; box"><input type="checkbox" name="hidePremium" /> Premium</label>
          <label title="The &quot;Live on X&quot; box"><input type="checkbox" name="hideLive" /> Live</label>
        </div>
      </fieldset>
    </form>

    <p class="note">
      <b>3/day</b> = average posts a day since joining. Replies and reposts count, so it's a
      hint, not proof.
    </p>

    <footer>
      <a href="https://x.com/buildwithSud" target="_blank" rel="noopener">@buildwithSud</a>
      <span aria-hidden="true">·</span>
      <a href="https://buymeacoffee.com/sudarshanhosalli" target="_blank" rel="noopener">Buy me a coffee ☕</a>
    </footer>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
